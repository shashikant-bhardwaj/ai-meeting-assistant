[project]
name = "video-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shashikant-bhardwaj", email = "bhardwajshashi531@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "audioop-lts>=0.2.2",
    "chromadb>=1.5.9",
    "fpdf2>=2.9.0",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "openai-whisper>=20250625",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
video-agent = "video_agent:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
